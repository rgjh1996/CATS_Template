<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <header th:fragment="header">
      <a class="brand" th:href="@{/}">
        <span class="brand-icon">
          C
        </span>
        CATS
      </a>
      <nav th:if="${currentUser != null}">
        <a th:if="${!currentUser.admin() || currentUser.manager()}" th:href="@{/employee}">
          Overview
        </a>
        <a th:if="${!currentUser.admin() || currentUser.manager()}" th:href="@{/applications}">
          My applications
        </a>
        <a th:if="${currentUser.manager()}" th:href="@{/manager/pending}">
          Team approvals
        </a>
        <a th:if="${currentUser.admin()}" th:href="@{/admin}">
          Administration
        </a>
      </nav>
      <div class="account" th:if="${currentUser != null}">
        <span th:text="${currentUser.name()}">
        </span>
        <form th:action="@{/logout}" method="post">
          <input type="hidden" name="_csrf" th:value="${csrfToken}">
          <button class="quiet">
            Sign out
          </button>
        </form>
      </div>
    </header>
    <div th:fragment="messages">
      <div class="notice success" role="status" th:if="${success}" th:text="${success}">
      </div>
      <div class="notice error" role="alert" th:if="${error}" th:text="${error}">
      </div>
    </div>
    <div th:fragment="table(items, managerView)" class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>
              Course
            </th>
            <th>
              Period
            </th>
            <th>
              Days
            </th>
            <th>
              Fee
            </th>
            <th>
              Status
            </th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${items}">
            <td>
              <a th:href="${managerView} ? @{/manager/applications/{id}(id=${a.id})} : @{/applications/{id}(id=${a.id})}" th:text="${a.courseTitle}">
              </a>
              <small th:text="${#strings.replace(a.category.name(),'_',' ')}">
              </small>
            </td>
            <td>
              <span th:text="${a.startDate}">
              </span>
              <small th:text="${a.endDate}">
              </small>
            </td>
            <td th:text="${a.trainingDays}">
            </td>
            <td th:text="|$${#numbers.formatDecimal(a.courseFee,1,2)}|">
            </td>
            <td>
              <span class="badge" th:classappend="${a.status.name()}" th:text="${a.status}">
              </span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="5" class="empty">
              No applications to show yet.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <section th:fragment="details(a)" class="card">
      <div class="section-heading">
        <h2 th:text="${a.courseTitle}">
        </h2>
        <span class="badge" th:classappend="${a.status.name()}" th:text="${a.status}">
        </span>
      </div>
      <dl>
        <dt>
          Employee
        </dt>
        <dd th:text="${a.employee.name}">
        </dd>
        <dt>
          Category
        </dt>
        <dd th:text="${#strings.replace(a.category.name(),'_',' ')}">
        </dd>
        <dt>
          Provider
        </dt>
        <dd th:text="${a.trainingProvider}">
        </dd>
        <dt>
          Period
        </dt>
        <dd>
          <span th:text="|${a.startDate} ${a.startSession} to ${a.endDate} ${a.endSession}|">
          </span>
        </dd>
        <dt>
          Training days
        </dt>
        <dd th:text="${a.trainingDays}">
        </dd>
        <dt>
          Course fee
        </dt>
        <dd th:text="|$${#numbers.formatDecimal(a.courseFee,1,2)}|">
        </dd>
        <dt>
          Justification
        </dt>
        <dd class="multiline" th:text="${a.justification}">
        </dd>
        <dt>
          Work dissemination
        </dt>
        <dd class="multiline" th:text="${a.workDissemination ?: 'Not provided'}">
        </dd>
        <dt>
          Manager decision reason
        </dt>
        <dd class="multiline" th:text="${a.managerComment ?: 'Awaiting decision'}">
        </dd>
        <dt>
          Experience
        </dt>
        <dd class="multiline" th:text="${a.experienceComment ?: 'Not recorded'}">
        </dd>
      </dl>
    </section>
    <section th:fragment="usage(u)" class="stats">
      <article class="card">
        <span class="eyebrow" th:text="|${u.year()} TRAINING DAYS|">
        </span>
        <strong th:text="${u.remainingDays()}">
        </strong>
        <p>
          days available of
          <span th:text="${u.dayLimit()}">
          </span>
        </p>
        <small th:text="|Committed: ${u.committedDays()} · Pending: ${u.pendingDays()}|">
        </small>
      </article>
      <article class="card">
        <span class="eyebrow" th:text="|${u.year()} TRAINING BUDGET|">
        </span>
        <strong th:text="|$${#numbers.formatDecimal(u.remainingBudget(),1,2)}|">
        </strong>
        <p>
          available of
          <span th:text="|$${#numbers.formatDecimal(u.budgetLimit(),1,2)}|">
          </span>
        </p>
        <small th:text="|Committed: $${u.committedFees()} · Pending: $${u.pendingFees()}|">
        </small>
      </article>
    </section>
  </body>
</html>

<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review application | CATS</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main><div th:replace="~{fragments/layout :: messages}"></div><div class="page-heading"><div><span class="eyebrow">MANAGER REVIEW</span><h1>Review course application</h1></div><a th:href="@{/manager/pending}">Back to team</a></div><div th:replace="~{fragments/layout :: details(${courseApplication})}"></div><div th:each="entry:${context.annualUsage()}"><div th:replace="~{fragments/layout :: usage(${entry.value})}"></div></div><section class="card"><h2>Other team members attending during this period</h2><p class="muted">Approved courses for your other reporting employees.</p><ul class="team-links"><li th:each="a:${context.otherTeamApprovedCourses()}" th:text="|${a.employee.name}: ${a.courseTitle} (${a.startDate} to ${a.endDate})|"></li></ul><p th:if="${#lists.isEmpty(context.otherTeamApprovedCourses())}" class="muted">No other approved courses overlap.</p></section><section class="card form-card" th:if="${courseApplication.status.name() == 'APPLIED' || courseApplication.status.name() == 'UPDATED'}"><h2>Your decision</h2><form method="post" th:action="@{/manager/applications/{id}/approve(id=${courseApplication.id})}" th:object="${form}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><label for="reason">Reason for your decision</label><textarea id="reason" th:field="*{reason}" rows="4" maxlength="2000" required></textarea><span class="field-error" th:errors="*{reason}"></span><div class="actions"><button class="primary">Approve</button><button class="danger" th:formaction="@{/manager/applications/{id}/reject(id=${courseApplication.id})}">Reject</button></div></form></section></main><footer>CATS · Course Application Tracking System</footer></body></html>

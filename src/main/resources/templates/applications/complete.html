<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Record attendance | CATS
    </title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
  </head>
  <body>
    <header th:replace="~{fragments/layout :: header}">
    </header>
    <main>
      <div th:replace="~{fragments/layout :: messages}">
      </div>
      <h1>
        Record your attendance
      </h1>
      <p th:text="${courseApplication.courseTitle}">
      </p>
      <section class="card form-card">
        <form method="post" th:action="@{/applications/{id}/complete(id=${courseApplication.id})}" th:object="${form}">
          <input type="hidden" name="_csrf" th:value="${csrfToken}">
          <label for="experience">
            What did you learn?
          </label>
          <textarea id="experience" th:field="*{experience}" rows="6" maxlength="2000" required>
          </textarea>
          <span class="field-error" th:errors="*{experience}">
          </span>
          <div class="actions">
            <button class="primary">
              Mark completed
            </button>
            <a th:href="@{/applications/{id}(id=${courseApplication.id})}">
              Back to application
            </a>
          </div>
        </form>
      </section>
    </main>
    <footer>
      CATS · Course Application Tracking System
    </footer>
  </body>
</html>

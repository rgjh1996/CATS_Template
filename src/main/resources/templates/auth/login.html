<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | CATS</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main><div th:replace="~{fragments/layout :: messages}"></div><section class="login card"><span class="eyebrow">LEARN · DEVELOP · GROW</span><h1 th:text="${adminLogin} ? 'Administrator sign in' : 'Welcome to CATS'"></h1><p class="muted">Manage your training journey in one place.</p><form method="post" th:action="${adminLogin} ? @{/admin/login} : @{/employee/login}" th:object="${form}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><label for="username">Username</label><input id="username" th:field="*{username}" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p class="field-error" th:if="${#fields.hasAnyErrors()}">Enter your username and password.</p><button class="primary wide">Sign in</button></form><a class="switch" th:href="${adminLogin} ? @{/employee/login} : @{/admin/login}" th:text="${adminLogin} ? 'Employee / manager sign in' : 'Administrator sign in'"></a></section></main><footer>CATS · Course Application Tracking System</footer></body></html>
